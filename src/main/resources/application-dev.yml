spring:
  datasource:
    url: jdbc:mysql://mysql-4ce7272-rtisas-69cd.k.aivencloud.com:21246/defaultdb?useSSL=true&requireSSL=true&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

