server:
  port: 8050

spring:
  application:
    name: inventarios-rti-api
  profiles:
    active: dev
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:InventariosRTI_SecretKey_2026_MustBeAtLeast256BitsForHS256Algorithm_ThisIsASecureKey}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
