spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test_secret_key_for_testing_purposes_must_be_at_least_256_bits_long_for_hs256_algorithm
  expiration-ms: 3600000

logging:
  level:
    com.rti.inventarios: INFO
